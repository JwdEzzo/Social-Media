# Default (English) messages.
# Placeholders use MessageFormat: {0}, {1}, ... filled from BaseException args.
# NOTE: a literal single quote must be doubled ('') in any value that contains a placeholder.

# ---------- Generic ----------
error.internal=An unexpected error occurred. Please try again later.
error.malformed_body=The request body could not be read. Please check the format and try again.
error.param.missing=The required parameter ''{0}'' is missing.
error.param.type_mismatch=The parameter ''{0}'' has an invalid value.

# ---------- Not found (404) ----------
user.notfound=User ''{0}'' was not found.
user.notfound.id=User with id {0} was not found.
user.notfound.email=No account is registered with the email ''{0}''.
user.profile.picture.notfound=No profile picture is stored for user ''{0}''.
post.notfound=Post with id {0} was not found.
post.image.notfound=No image data is stored for post {0}.
comment.notfound=Comment with id {0} was not found.
comment.reply.notfound=Reply with id {0} was not found.
follow.request.notfound=Follow request {0} was not found.
notification.notfound=Notification with id {0} was not found.
error.resource.notfound=The URL you are trying to call could not be found.

# ---------- Bad request (400) ----------
error.same.email=The new email must be different from the current email.
error.same.username=The new username must be different from the current username.
error.same.password=The new password must be different from the current password.
error.old.password.different=The old password provided does not match the current password.
follow.self=You cannot follow yourself.
error.validation=Validation failed for one or more fields.

# ---------- Bean Validation (400) ----------
# Resolved by Hibernate Validator through this bundle, not by MessageSource, so {min} and {max}
# are constraint attributes and MessageFormat never runs. Single quotes stay literal here - do
# not double them, and do not use {0}-style placeholders.
validation.email.required=Email is required.
validation.email.invalid=Email is not valid.
validation.email.size=Email must be at most {max} characters.
validation.username.required=Username is required.
validation.username.size=Username must be between {min} and {max} characters.
validation.username.charset=Username can only contain letters, numbers, dots, and underscores.
validation.password.required=Password is required.
validation.password.size=Password must be between {min} and {max} characters.
validation.password.strength=Password must contain at least one lowercase letter, one uppercase letter, and one digit.

# ---------- Already exists (409) ----------
user.exists=The username ''{0}'' is already taken.
email.exists=An account with the email ''{0}'' already exists.
follow.request.exists=You have already sent a follow request to ''{0}''.
signup.conflict=That username or email is already taken.

# ---------- Forbidden (403) ----------
# Authenticated, but acting on a resource the caller does not own.
# Permission errors should not echo entity details back to a caller who was just refused.
error.forbidden=You are not authorized to perform this action.
comment.forbidden.edit=You do not have permission to edit this comment.
comment.forbidden.delete=You do not have permission to delete this comment.
comment.reply.forbidden.edit=You do not have permission to edit this reply.
comment.reply.forbidden.delete=You do not have permission to delete this reply.
notification.forbidden.access=You do not have permission to access these notifications.
follow.request.forbidden.respond=You cannot respond to this follow request.
follow.request.forbidden.cancel=You cannot cancel this follow request.

# ----------  Unauthorized (401) ----------
# Not authenticated: identity was never established, or the credentials offered were wrong.
# Deliberately says nothing about which half failed because naming the username would confirm to an
# attacker that the account exists.
error.invalid.credentials=The credentials provided are not valid.
# No token was presented at all, as opposed to a token that was presented and rejected.
error.authentication.required=Authentication is required to access this resource.
error.token.expired=Your session has expired. Please log in again.
error.token.invalid=The provided token is invalid. Please log in again.

# ---------- Method Not Allowed (405) ----------
error.method.notsupported=The HTTP method ''{0}'' is not supported for this endpoint.
