# French messages.
# Placeholders use MessageFormat: {0}, {1}, ... filled from BaseException args.
# NOTE: a literal single quote must be doubled ('') in any value that contains a placeholder.
# Encoding is UTF-8 (LocaleConfig sets setDefaultEncoding("UTF-8")) - keep this file saved as UTF-8.

# ---------- Generic ----------
error.internal=Une erreur inattendue s''est produite. Veuillez réessayer plus tard.
error.malformed_body=Le corps de la requête est illisible. Veuillez vérifier le format et réessayer.
error.param.missing=Le paramètre requis « {0} » est manquant.
error.param.type_mismatch=Le paramètre « {0} » a une valeur invalide.

# ---------- Not found (404) ----------
user.notfound=L''utilisateur « {0} » est introuvable.
user.notfound.id=L''utilisateur avec l''identifiant {0} est introuvable.
user.notfound.email=Aucun compte n''est associé à l''adresse « {0} ».
user.profile.picture.notfound=Aucune photo de profil n''est enregistrée pour l''utilisateur « {0} ».
post.notfound=La publication avec l''identifiant {0} est introuvable.
post.image.notfound=Aucune image n''est enregistrée pour la publication {0}.
comment.notfound=Le commentaire avec l''identifiant {0} est introuvable.
comment.reply.notfound=La réponse avec l''identifiant {0} est introuvable.
follow.request.notfound=La demande d''abonnement {0} est introuvable.
notification.notfound=La notification avec l''identifiant {0} est introuvable.

# ---------- Déjà existant (409) ----------
user.exists=Le nom d''utilisateur « {0} » est déjà pris.
email.exists=Un compte avec l''adresse e-mail « {0} » existe déjà.
follow.request.exists=Vous avez déjà envoyé une demande d''abonnement à « {0} ».
# Levé lorsque la contrainte d''unicité de la base se déclenche, sans indiquer la colonne en cause.
signup.conflict=Ce nom d''utilisateur ou cette adresse e-mail est déjà utilisé.

# ---------- Requête invalide (400) ----------
# Renvoi d''un identifiant que le compte possède déjà : aucun conflit, rien de manquant, simplement sans effet.
error.same.email=La nouvelle adresse e-mail doit être différente de l''adresse actuelle.
error.same.username=Le nouveau nom d''utilisateur doit être différent du nom actuel.
error.same.password=Le nouveau mot de passe doit être différent du mot de passe actuel.
error.old.password.different=L'ancien mot de passe fourni ne correspond pas au mot de passe actuel.
follow.self=Vous ne pouvez pas vous abonner à vous-même.
error.validation=La validation a échoué pour un ou plusieurs champs.

# ---------- Validation des champs (400) ----------
# Résolus par Hibernate Validator via ce bundle, et non par MessageSource : {min} et {max} sont des
# attributs de contrainte et MessageFormat ne s'applique jamais. Les apostrophes restent littérales
# ici - ne pas les doubler, et ne pas utiliser de paramètres de style {0}.
validation.email.required=L'adresse e-mail est obligatoire.
validation.email.invalid=L'adresse e-mail n'est pas valide.
validation.email.size=L'adresse e-mail ne doit pas dépasser {max} caractères.
validation.username.required=Le nom d'utilisateur est obligatoire.
validation.username.size=Le nom d'utilisateur doit contenir entre {min} et {max} caractères.
validation.username.charset=Le nom d'utilisateur ne peut contenir que des lettres, des chiffres, des points et des tirets bas.
validation.password.required=Le mot de passe est obligatoire.
validation.password.size=Le mot de passe doit contenir entre {min} et {max} caractères.
validation.password.strength=Le mot de passe doit contenir au moins une minuscule, une majuscule et un chiffre.

# ---------- Accès refusé (403) ----------
# NOTE : garder ces messages sans paramètres {0}. Sans arguments, le MessageSource
# n'applique pas MessageFormat, ce qui permet d'utiliser des apostrophes simples.
error.forbidden=Vous n'êtes pas autorisé à effectuer cette action.
comment.forbidden.edit=Vous n'avez pas la permission de modifier ce commentaire.
comment.forbidden.delete=Vous n'avez pas la permission de supprimer ce commentaire.
comment.reply.forbidden.edit=Vous n'avez pas la permission de modifier cette réponse.
comment.reply.forbidden.delete=Vous n'avez pas la permission de supprimer cette réponse.
notification.forbidden.access=Vous n'avez pas la permission d'accéder à ces notifications.
follow.request.forbidden.respond=Vous ne pouvez pas répondre à cette demande d'abonnement.
follow.request.forbidden.cancel=Vous ne pouvez pas annuler cette demande d'abonnement.

# ---------- Non authentifié (401) ----------
# Ne précise pas quelle moitié a échoué : nommer l'utilisateur confirmerait son existence.
error.invalid.credentials=Les identifiants fournis ne sont pas valides.
# Aucun jeton n'a été présenté, par opposition à un jeton présenté puis rejeté.
error.authentication.required=Une authentification est requise pour accéder à cette ressource.
